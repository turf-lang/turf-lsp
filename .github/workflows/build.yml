name: Build, test, package

# Builds the language server against the compiler, tests it at every layer, and
# packages the VS Code extension for each platform with the server and the
# standard library inside. The last step of each job installs THAT .vsix into a
# real VS Code and drives it, so what is tested is what a user installs.
#
# Platforms: Linux x64, Windows x64, macOS arm64 (the compiler's Tier 1).
#
# The package step refuses a server that depends on libraries a user may
# lack, and prints which, so a mistake in the static link cannot ship.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs this same build and then publishes what it made

env:
  # The compiler release this server embeds, and whose standard library the
  # extension bundles: a release of turf-lsp ships against a released
  # compiler, never its master. compiler-sync.yml follows master nightly, so a
  # change there is known before this pin moves to the next release.
  TURF_LANG_REPO: turf-lang/turf-lang
  TURF_LANG_REF: v2.2.0

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    # The server runs on the glibc of the system it is built on and anything
    # newer, so it is built in the oldest image the compiler's own Linux
    # archive supports, not on the runner (ubuntu-latest's glibc gave a 1.0.0
    # server that needed GLIBC_2.38 and did not start on Ubuntu 22.04 or
    # Debian 12). "The glibc floor" below checks the result.
    container: ubuntu:22.04
    env:
      TARGET: linux-x64
      GLIBC_FLOOR: "2.35"
    steps:
      # A bare image, the job running as root: sudo is installed so the steps
      # read as on a runner. The X and GTK libraries are what VS Code (Electron)
      # needs to start under xvfb for the last step.
      - name: Prepare the container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y sudo wget curl gnupg lsb-release ca-certificates \
            software-properties-common build-essential git python3 binutils xvfb xauth \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1 libxkbfile1 libsecret-1-0
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          path: turf-lsp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TURF_LANG_REPO }}
          ref: ${{ env.TURF_LANG_REF }}
          path: turf-lang

      - name: Install LLVM 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake ninja-build libzstd-dev zlib1g-dev xvfb
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      # turf comes from turf-cli, at the revision the compiler pins
      # (TURF_CLI_REVISION); an older turf-lang still carries it as cli/.
      - name: Which turf-cli
        id: cli
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < turf-lang/TURF_CLI_REVISION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: turf source (turf-cli, if turf-lang has no cli/)
        if: hashFiles('turf-lang/cli/go.mod') == ''
        uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-cli
          ref: ${{ steps.cli.outputs.rev }}
          path: turf-cli
      - name: Point the turf build at turf-cli
        if: hashFiles('turf-lang/cli/go.mod') == ''
        shell: bash
        run: echo "TURF_CLI_DIR=$GITHUB_WORKSPACE/turf-cli" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ hashFiles('turf-lang/cli/go.mod') != '' && 'turf-lang/cli/go.mod' || 'turf-cli/go.mod' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build turf (the project-graph helper)
        run: |
          cd "${TURF_CLI_DIR:-turf-lang/cli}"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/out/turf" ./cmd/turf

      # --as-needed drops libraries LLVM's metadata names but nothing here uses;
      # the C++ runtime is linked in, so the server needs only the C library.
      - name: Build the server
        run: |
          cmake -S turf-lsp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTURF_LANG_DIR="$GITHUB_WORKSPACE/turf-lang" -DTURF_STATIC_LLVM=ON \
            -DLLVM_USE_STATIC_ZSTD=ON -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--as-needed -static-libstdc++ -static-libgcc"
          cmake --build build --parallel

      - name: The glibc floor
        run: |
          need=$(objdump -T build/turf-lsp | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "turf-lsp needs glibc $need; the floor is $GLIBC_FLOOR"
          if [ "$(printf '%s\n%s\n' "$need" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::turf-lsp needs glibc $need, newer than the supported $GLIBC_FLOOR"
            exit 1
          fi

      - name: Unit tests, grammar check
        run: |
          build/turf-lsp-tests
          python3 turf-lsp/scripts/check_grammar.py --server build/turf-lsp

      - name: Server smoke test (a staged install, TURF_HOME unset)
        run: python3 turf-lsp/scripts/smoke.py --server build/turf-lsp --stdlib-from turf-lang --turf out/turf

      - name: Package the extension
        run: |
          cd turf-lsp
          python3 scripts/package_vsix.py --target ${{ env.TARGET }} --server ../build/turf-lsp \
            --turf ../out/turf --stdlib ../turf-lang --out ../dist

      - name: Extension unit tests
        run: cd turf-lsp/editors/vscode && npm test

      - name: Install the .vsix into a real VS Code and drive it
        run: |
          cd turf-lsp/editors/vscode
          xvfb-run -a node out/test/integration/runTest.js "$GITHUB_WORKSPACE"/dist/turf-${{ env.TARGET }}-*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ env.TARGET }}
          path: |
            dist/*.vsix
            dist/turf-lsp-*

  windows-x64:
    runs-on: windows-latest
    env:
      TARGET: win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          path: turf-lsp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TURF_LANG_REPO }}
          ref: ${{ env.TURF_LANG_REF }}
          path: turf-lang

      - name: Set up MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-llvm mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd mingw-w64-x86_64-python

      # turf comes from turf-cli, at the revision the compiler pins
      # (TURF_CLI_REVISION); an older turf-lang still carries it as cli/.
      - name: Which turf-cli
        id: cli
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < turf-lang/TURF_CLI_REVISION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: turf source (turf-cli, if turf-lang has no cli/)
        if: hashFiles('turf-lang/cli/go.mod') == ''
        uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-cli
          ref: ${{ steps.cli.outputs.rev }}
          path: turf-cli
      - name: Point the turf build at turf-cli
        if: hashFiles('turf-lang/cli/go.mod') == ''
        shell: bash
        run: echo "TURF_CLI_DIR=$GITHUB_WORKSPACE/turf-cli" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ hashFiles('turf-lang/cli/go.mod') != '' && 'turf-lang/cli/go.mod' || 'turf-cli/go.mod' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build turf
        shell: bash
        run: |
          cd "${TURF_CLI_DIR:-turf-lang/cli}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/out/turf.exe" ./cmd/turf

      # Fully static: no libstdc++, libgcc or winpthread DLLs next to the server.
      - name: Build the server
        shell: msys2 {0}
        run: |
          cmake -S turf-lsp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTURF_LANG_DIR="$GITHUB_WORKSPACE/turf-lang" -DTURF_STATIC_LLVM=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build --parallel

      - name: Unit tests, grammar check
        shell: msys2 {0}
        run: |
          build/turf-lsp-tests
          python turf-lsp/scripts/check_grammar.py --server build/turf-lsp.exe

      - name: Server smoke test (a staged install, TURF_HOME unset)
        shell: msys2 {0}
        run: python turf-lsp/scripts/smoke.py --server build/turf-lsp.exe --stdlib-from turf-lang --turf out/turf.exe

      - name: Package the extension
        shell: msys2 {0}
        run: |
          cd turf-lsp
          python scripts/package_vsix.py --target ${{ env.TARGET }} --server ../build/turf-lsp.exe \
            --turf ../out/turf.exe --stdlib ../turf-lang --out ../dist

      - name: Extension unit tests
        shell: bash
        run: cd turf-lsp/editors/vscode && npm test

      - name: Install the .vsix into a real VS Code and drive it
        shell: bash
        run: |
          cd turf-lsp/editors/vscode
          node out/test/integration/runTest.js "$GITHUB_WORKSPACE"/dist/turf-${{ env.TARGET }}-*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ env.TARGET }}
          path: |
            dist/*.vsix
            dist/turf-lsp-*

  macos-arm64:
    runs-on: macos-14
    env:
      TARGET: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: turf-lsp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TURF_LANG_REPO }}
          ref: ${{ env.TURF_LANG_REF }}
          path: turf-lang

      - name: Install LLVM
        run: |
          brew install llvm cmake ninja zstd
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # turf comes from turf-cli, at the revision the compiler pins
      # (TURF_CLI_REVISION); an older turf-lang still carries it as cli/.
      - name: Which turf-cli
        id: cli
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < turf-lang/TURF_CLI_REVISION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: turf source (turf-cli, if turf-lang has no cli/)
        if: hashFiles('turf-lang/cli/go.mod') == ''
        uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-cli
          ref: ${{ steps.cli.outputs.rev }}
          path: turf-cli
      - name: Point the turf build at turf-cli
        if: hashFiles('turf-lang/cli/go.mod') == ''
        shell: bash
        run: echo "TURF_CLI_DIR=$GITHUB_WORKSPACE/turf-cli" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ hashFiles('turf-lang/cli/go.mod') != '' && 'turf-lang/cli/go.mod' || 'turf-cli/go.mod' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build turf
        run: |
          cd "${TURF_CLI_DIR:-turf-lang/cli}"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/out/turf" ./cmd/turf

      # -dead_strip_dylibs: record only the libraries something actually uses.
      - name: Build the server
        run: |
          cmake -S turf-lsp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTURF_LANG_DIR="$GITHUB_WORKSPACE/turf-lang" -DTURF_STATIC_LLVM=ON \
            -DLLVM_USE_STATIC_ZSTD=ON -DCMAKE_PREFIX_PATH="$(brew --prefix llvm);$(brew --prefix zstd)" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-dead_strip_dylibs"
          cmake --build build --parallel

      - name: Unit tests, grammar check
        run: |
          build/turf-lsp-tests
          python3 turf-lsp/scripts/check_grammar.py --server build/turf-lsp

      - name: Server smoke test (a staged install, TURF_HOME unset)
        run: python3 turf-lsp/scripts/smoke.py --server build/turf-lsp --stdlib-from turf-lang --turf out/turf

      - name: Package the extension
        run: |
          cd turf-lsp
          python3 scripts/package_vsix.py --target ${{ env.TARGET }} --server ../build/turf-lsp \
            --turf ../out/turf --stdlib ../turf-lang --out ../dist

      - name: Extension unit tests
        run: cd turf-lsp/editors/vscode && npm test

      - name: Install the .vsix into a real VS Code and drive it
        run: |
          cd turf-lsp/editors/vscode
          node out/test/integration/runTest.js "$GITHUB_WORKSPACE"/dist/turf-${{ env.TARGET }}-*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ env.TARGET }}
          path: |
            dist/*.vsix
            dist/turf-lsp-*
